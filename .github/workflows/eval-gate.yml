name: Dictionary eval gate

# 合入 main 就是发布（release-built-dictionaries.yml），约 24 小时后客户端自动收到，所以排序评测必须在合入之前跑完。这里在每个改动发布输入（sources/、custom/、curation/、upstream.lock.json、builder.lock.json，以及决定发布怎么构建的 release-built-dictionaries.yml）的 Pull Request 上：用候选提交里 builder.lock.json 固定的 msime 构建器构建候选词库 C，下载最新的 dict-v 发布作为基线 B，再由同一个 msime 提交里的 scripts/dict_eval_gate.py 跑 dict-cleanse 方案 4.3 的五道硬门槛（金标准对不丢、must-outrank、粗俗首屏曝光 C ≤ B、quanpin-words-v2 三种键盘的配对 McNemar、全拼行数下限）。同一个作业还按发布 workflow 的命令构建 languages 词库（粤拼、注音、笔画），把 C 与 B 的两组产物逐表逐行比较（dict_artifact_diff.py，即逐词的删除、降权清单），并列出五笔和英文的 top-N 差异（dictionary_topn_diff.py），附在报告后面，只报告不判定。报告写进作业摘要、上传为 artifact `dictionary-eval-gate`，候选产物上传为 `dictionary-candidate`（保留 7 天），同仓库的 PR 上更新一条评论；任何一道门槛失败、任何一步构建或比较失败，这个检查就失败。
#
# 评测脚本和构建器取自同一个固定提交：门槛的口径（评测集、词表、判定规则）随构建器一起由 builder.lock.json 显式升级，不跟随 msime develop。固定提交里还没有 scripts/dict_eval_gate.py 时作业失败并说明原因，先把 builder.lock.json 升到含它的提交。手动运行可以用 msime_ref 换一个 msime 分支或提交试跑（只用于试跑；PR 上总是用固定提交）。
#
# 不改动发布输入的 PR（文档、packs/、workflow 以外的脚本）不会发布任何东西，作业只判定范围就以成功结束，这样把「Eval gate」设为 main 的 required check 时，这些 PR 不会一直等一个不会出现的检查。
#
# 评测臂默认两臂：挂整句模型的一臂是产品默认，跑全部门槛；不挂模型的一臂只跑 quanpin-words-v2，量词库权重本身（方案 4.2）。两臂都另跑方案 4.3 的参考项（sentences-v1、九键长句、particles、neutral），只报告。
#
# 时间：全部 convert_eval 并行跑在 8 核 runner 上。2026-11-04 在分支上的试跑（两臂、quanpin-words-v2 全量，构建器有 sccache 缓存）整个作业约 16 分钟，其中门槛 12 分钟，离 120 分钟上限很远，所以默认全量。构建器换了大版本、缓存全失效时编译会多出十几分钟；作业逼近上限时，把 QUANPIN_V2_LIMIT 设成等距子集的大小（B、C 用同一批用例，其余门槛仍然全量）。
on:
  push:
    branches: [cleanse-data/eval-gate-ci]
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      msime_ref:
        description: "留空用 builder.lock.json 固定的 msime 提交；填 msime 的分支、标签或提交只用于试跑"
        required: false
        default: ""
        type: string
      limit:
        description: "quanpin-words-v2 的等距子集大小，0 是全量；留空用 workflow 的默认值"
        required: false
        default: ""
        type: string
      arms:
        description: "评测臂：model（产品默认，挂模型），或 model,engine 再加一臂不挂模型（只跑 quanpin-words-v2）"
        required: false
        default: model,engine
        type: string

permissions: {}

env:
  # quanpin-words-v2 等距子集的默认大小，0 是全量（23,295 条）。
  QUANPIN_V2_LIMIT: "0"
  # 同时跑几个 convert_eval（每个只用一个核）。
  EVAL_JOBS: "8"

jobs:
  eval:
    name: Eval gate
    runs-on: depot-ubuntu-24.04-8
    timeout-minutes: 120
    permissions:
      contents: read
    concurrency:
      group: dictionary-eval-gate-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    outputs:
      relevant: ${{ steps.scope.outputs.relevant }}
    env:
      SCCACHE_IGNORE_SERVER_IO_ERROR: '1'
      CARGO_INCREMENTAL: '0'
    steps:
      # 历史只取提交不取文件内容：判定范围要比较基准提交，构建只需要本次提交的文件。PR 上检出的是合并提交，评测的就是合入后会发布的内容。
      - name: Checkout dictionary sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: dictionary
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - name: Decide whether this change reaches a release
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          MERGE_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            pull_request) base="$PR_BASE" ;;
            merge_group) base="$MERGE_BASE" ;;
            *) base="" ;;
          esac
          relevant=true
          if [[ -n "$base" ]]; then
            # upstream.lock.json 由构建器逐项核对（版本、提交、引用对不上就构建失败），也算进 manifest 的 source.dirty；发布 workflow 决定发布用什么命令构建。
            changed="$(git -C dictionary diff --no-renames --name-only "$base" HEAD -- sources custom curation upstream.lock.json builder.lock.json .github/workflows/release-built-dictionaries.yml .github/workflows/eval-gate.yml)"
            if [[ -z "$changed" ]]; then
              relevant=false
              echo "这次改动没有碰发布输入（sources/、custom/、curation/、upstream.lock.json、builder.lock.json、发布 workflow），合入不会改变发布的内容，不跑评测。" >> "$GITHUB_STEP_SUMMARY"
            else
              printf 'changed release inputs:\n%s\n' "$changed"
            fi
          fi
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"
      # 固定提交来自候选提交自己的 builder.lock.json：升级构建器的 PR 评测的就是新构建器构建、新门槛判定的结果。这里只核对格式；提交在不在 msime develop 上由 quality.yml 的 Builder pin 检查。
      - name: Resolve the msime builder
        id: builder
        if: ${{ steps.scope.outputs.relevant == 'true' }}
        env:
          OVERRIDE: ${{ inputs.msime_ref || 'cleanse/eval-gate-ci' }}
        run: |
          set -euo pipefail
          pin="$(jq -er '.msime_commit' dictionary/builder.lock.json)"
          [[ "$pin" =~ ^[0-9a-f]{40}$ ]] || { echo "builder.lock.json msime_commit must be a full 40-character commit, got '$pin'" >&2; exit 1; }
          ref="${OVERRIDE:-$pin}"
          pinned=false
          [[ "$ref" == "$pin" ]] && pinned=true
          {
            echo "pin=$pin"
            echo "ref=$ref"
            echo "pinned=$pinned"
          } >> "$GITHUB_OUTPUT"
          echo "msime: $ref (pinned: $pinned)"
      - name: Checkout msime builder and eval tools
        if: ${{ steps.scope.outputs.relevant == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: metasequoiaime/msime
          ref: ${{ steps.builder.outputs.ref }}
          path: msime
          persist-credentials: false
      - name: Check the eval entry point
        id: tools
        if: ${{ steps.scope.outputs.relevant == 'true' }}
        run: |
          set -euo pipefail
          commit="$(git -C msime rev-parse HEAD)"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          for script in dict_eval_gate.py dict_artifact_diff.py dictionary_topn_diff.py; do
            if [[ ! -f "msime/scripts/$script" ]]; then
              echo "::error::msime $commit has no scripts/$script; bump builder.lock.json to a msime develop commit that includes the eval gate before relying on this check"
              exit 1
            fi
          done
      # 按 msime 锁下载的源数据（ECDICT、zhwiki 语料片段、区划表、SCOWL、HKCanCor）。构建器只复用大小和摘要都对得上的文件，缓存旧了只会多下载。
      - name: Restore the pinned dictionary sources
        id: sources
        if: ${{ steps.scope.outputs.relevant == 'true' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/dictionary-sources
          key: dictionary-eval-sources-${{ hashFiles('msime/resources/dictionary-sources.lock.json') }}
          restore-keys: dictionary-eval-sources-
      # Depot 的 runner 已把 SCCACHE_WEBDAV_ENDPOINT 指向 Depot Cache；sccache 装不上或起不来时照常不带缓存编译。
      - name: Install sccache
        id: sccache
        if: ${{ steps.scope.outputs.relevant == 'true' }}
        continue-on-error: true
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: Enable sccache
        if: ${{ steps.scope.outputs.relevant == 'true' && steps.sccache.outcome == 'success' }}
        run: |
          if sccache --start-server; then
            echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          else
            echo "::warning::sccache did not start; the Rust build runs without the compile cache"
          fi
      - name: Build msime-dict-build and convert_eval
        if: ${{ steps.scope.outputs.relevant == 'true' }}
        working-directory: msime
        run: |
          set -euo pipefail
          rustup toolchain install
          cargo build --release --locked -p msime-dict-builder --bin msime-dict-build
          cargo build --release --locked -p msime-input-runtime --example convert_eval
      # 主构建和 languages 的命令与发布 workflow 相同，分两个目录放，与基线的两组附件（msime-SHA256SUMS.txt、msime-language-dictionaries-SHA256SUMS）一一对应。评测只读主产物；languages 在这里构建是为了让粤拼、注音、笔画的构建错误在合入之前暴露，并参与产物差异。
      - name: Build the candidate dictionaries
        id: candidate
        if: ${{ steps.scope.outputs.relevant == 'true' }}
        env:
          SOURCE_SHA: ${{ github.sha }}
          MSIME_COMMIT: ${{ steps.tools.outputs.commit }}
        run: |
          set -euo pipefail
          build="$RUNNER_TEMP/build"
          out="$RUNNER_TEMP/candidate"
          languages="$RUNNER_TEMP/candidate-languages"
          msime/target/release/msime-dict-build --repository msime --dictionary "$GITHUB_WORKSPACE/dictionary" --cache "$RUNNER_TEMP/dictionary-sources" --out "$build/main"
          msime/target/release/msime-dict-build languages --repository msime --dictionary "$GITHUB_WORKSPACE/dictionary" --cache "$RUNNER_TEMP/dictionary-sources" --out "$build/languages"
          (cd "$build/main" && sha256sum -c msime-SHA256SUMS.txt)
          (cd "$build/languages" && sha256sum -c msime-language-dictionaries-SHA256SUMS)
          # 构建目录里还有不发布的中间文件（五笔补充码表的 *-supplement.txt，三个共约 37 MB）：只取校验和清单列出的文件和清单本身，与发布的附件、与基线下载的文件一一对应。
          publishable() {
            local from="$1" sums="$2" to="$3"
            mkdir -p "$to"
            ln "$from/$sums" "$to/"
            while read -r _ name; do
              ln "$from/${name#\*}" "$to/"
            done < "$from/$sums"
          }
          publishable "$build/main" msime-SHA256SUMS.txt "$out"
          publishable "$build/languages" msime-language-dictionaries-SHA256SUMS "$languages"
          # 与发布 workflow 的清单检查相同：评测的必须是这次检出的提交、用这个 msime 提交构建的授权产物。
          jq -e --arg sha "$SOURCE_SHA" --arg msime "$MSIME_COMMIT" '.licensing.includes_unlicensed_inputs == false and .source.dirty == false and .source.commit == $msime and .custom_dictionary_commit == $sha' "$out/msime-dictionary-manifest.json" >/dev/null || {
            echo "candidate manifest check failed: expected unlicensed inputs excluded, a clean builder at $MSIME_COMMIT and dictionary commit $SOURCE_SHA" >&2
            jq '{licensing, source, custom_dictionary_commit}' "$out/msime-dictionary-manifest.json" >&2
            exit 1
          }
      - name: Save the pinned dictionary sources
        if: ${{ !cancelled() && steps.scope.outputs.relevant == 'true' && steps.sources.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/dictionary-sources
          key: ${{ steps.sources.outputs.cache-primary-key }}
      # 基线是用户此刻手里的词库：本仓最新的 dict-v 发布（每次合入发布一版，所以运行时现查，不固定版本），按它自带的 msime-SHA256SUMS.txt 和 msime-language-dictionaries-SHA256SUMS 下载并校验其中列出的全部文件。
      - name: Download the baseline release
        id: baseline
        if: ${{ steps.scope.outputs.relevant == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases --limit 100 --json tagName --jq '[.[].tagName | select(test("^dict-v[0-9]+\\.[0-9]+\\.[0-9]+$"))] | sort_by(ltrimstr("dict-v") | split(".") | map(tonumber)) | last // empty')"
          [[ -n "$tag" ]] || { echo "no dict-v release to compare against" >&2; exit 1; }
          fetch() {
            local sums="$1" dir="$2"
            mkdir -p "$dir"
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir "$dir" -p "$sums"
            local patterns=()
            while read -r _ name; do
              patterns+=(-p "${name#\*}")
            done < "$dir/$sums"
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir "$dir" "${patterns[@]}"
            (cd "$dir" && sha256sum -c "$sums")
          }
          fetch msime-SHA256SUMS.txt "$RUNNER_TEMP/baseline"
          fetch msime-language-dictionaries-SHA256SUMS "$RUNNER_TEMP/baseline-languages"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "baseline: $tag"
      # 方案第 5 节要求每个词库 PR 附上逐词的删除和降权清单：两组产物逐表逐行比较，JSON 里每张表每类差异最多列 200000 行（一次清洗批次远小于这个数，全部列出），Markdown 只放样例。五笔和英文没有金标准，top-N 差异清单只作审阅附件。都只报告；比较不了（库打不开）时这一步失败。
      - name: Diff the candidate against the baseline
        if: ${{ steps.scope.outputs.relevant == 'true' }}
        working-directory: msime
        run: |
          set -euo pipefail
          diff="$RUNNER_TEMP/report/diff"
          mkdir -p "$diff"
          python3 scripts/dict_artifact_diff.py --base "$RUNNER_TEMP/baseline" --head "$RUNNER_TEMP/candidate" --markdown "$diff/main.md" --json "$diff/main.json" --json-samples 200000 --max-markdown-chars 15000
          python3 scripts/dict_artifact_diff.py --base "$RUNNER_TEMP/baseline-languages" --head "$RUNNER_TEMP/candidate-languages" --markdown "$diff/languages.md" --json "$diff/languages.json" --json-samples 200000 --max-markdown-chars 8000
          python3 scripts/dictionary_topn_diff.py --before "$RUNNER_TEMP/baseline" --after "$RUNNER_TEMP/candidate" --out "$diff/topn"
      # 挂模型的一臂是产品默认：模型在 msime 桌面词库锁里，按锁的 URL 下载、按锁的 SHA-256 校验。
      - name: Download the sentence model
        if: ${{ steps.scope.outputs.relevant == 'true' }}
        run: |
          set -euo pipefail
          entry="$(jq -ec '.artifacts[] | select(.name == "sentence-model.safetensors")' msime/resources/desktop-dictionary.lock.json)"
          url="$(jq -r .url <<< "$entry")"
          sha="$(jq -r .sha256 <<< "$entry")"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/sentence-model.safetensors" "$url"
          echo "$sha  $RUNNER_TEMP/sentence-model.safetensors" | sha256sum -c
      - name: Run the hard gates
        id: gate
        if: ${{ steps.scope.outputs.relevant == 'true' }}
        env:
          EVENT: ${{ github.event_name }}
          SOURCE_SHA: ${{ github.sha }}
          MSIME_REF: ${{ steps.builder.outputs.ref }}
          MSIME_COMMIT: ${{ steps.tools.outputs.commit }}
          PINNED: ${{ steps.builder.outputs.pinned }}
          BASELINE_TAG: ${{ steps.baseline.outputs.tag }}
          LIMIT_INPUT: ${{ inputs.limit }}
          ARMS_INPUT: ${{ inputs.arms || 'model,engine' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/report"
          mkdir -p "$report"
          limit="${LIMIT_INPUT:-$QUANPIN_V2_LIMIT}"
          [[ "$limit" =~ ^[0-9]+$ ]] || { echo "limit must be a non-negative integer, got '$limit'" >&2; exit 1; }
          arms="${ARMS_INPUT:-model,engine}"
          server="${GITHUB_SERVER_URL:-https://github.com}"
          # printf 的格式串用单引号包住，Markdown 代码片段里的反引号保持字面含义。
          # shellcheck disable=SC2016
          {
            printf -- '- 候选：本仓 [`%s`](%s/%s/commit/%s)（%s）\n' "${SOURCE_SHA:0:10}" "$server" "$GITHUB_REPOSITORY" "$SOURCE_SHA" "$EVENT"
            if [[ "$PINNED" == true ]]; then
              printf -- '- 构建器与评测工具：msime [`%s`](%s/metasequoiaime/msime/commit/%s)，`builder.lock.json` 固定的提交\n' "${MSIME_COMMIT:0:10}" "$server" "$MSIME_COMMIT"
            else
              printf -- '- 构建器与评测工具：试跑指定的 msime `%s`，即 [`%s`](%s/metasequoiaime/msime/commit/%s)，不是 `builder.lock.json` 固定的提交\n' "$MSIME_REF" "${MSIME_COMMIT:0:10}" "$server" "$MSIME_COMMIT"
            fi
            printf -- '- 基线：[`%s`](%s/%s/releases/tag/%s)，用户现在自动更新到的版本\n' "$BASELINE_TAG" "$server" "$GITHUB_REPOSITORY" "$BASELINE_TAG"
            printf -- '- [workflow 运行](%s)：完整的 JSON 报告、两边的曝光报告和产物差异清单在 artifact `dictionary-eval-gate` 里，候选产物在 `dictionary-candidate` 里（保留 7 天）\n' "$RUN_URL"
          } > "$report/preamble.md"
          status=0
          (cd msime && python3 scripts/dict_eval_gate.py run \
            --baseline "$RUNNER_TEMP/baseline" --candidate "$RUNNER_TEMP/candidate" \
            --model "$RUNNER_TEMP/sentence-model.safetensors" --binary target/release/examples/convert_eval \
            --work "$RUNNER_TEMP/eval" --jobs "$EVAL_JOBS" --limit "$limit" --arms "$arms" \
            --must-outrank-strict --preamble "$report/preamble.md" --markdown "$report/report.md" --json "$report/report.json") > "$report/stdout.txt" || status=$?
          cp "$RUNNER_TEMP"/eval/exposure-*.json "$report/" 2>/dev/null || true
          if [[ ! -s "$report/report.md" ]]; then
            printf '## 词库评测把关\n\n%s\n**评测没能跑完**（exit %s），没有结论，见 workflow 日志。\n' "$(cat "$report/preamble.md")" "$status" > "$report/report.md"
          fi
          # 产物差异附在评测报告后面，标题降两级放进折叠块。
          # shellcheck disable=SC2016
          {
            printf '\n### 产物差异（参考，只报告）\n\n'
            printf '与基线逐表逐行比较（`dict_artifact_diff.py`），完整的新增、删除、改权重清单在 artifact 的 `diff/main.json`、`diff/languages.json`；五笔和英文的 top-N 差异清单在 `diff/topn/`。\n\n'
            printf '| top-N 清单 | 比较 | 变了 | 首选变了 |\n| --- | --- | --- | --- |\n'
            jq -r '.lists | to_entries[] | "| \(.key) | \(.value.compared) | \(.value.changed) | \(.value.top1_changed // "-") |"' "$report/diff/topn/summary.json"
            for part in main languages; do
              title="主词库"
              [[ "$part" == languages ]] && title="languages（粤拼、注音、笔画）"
              printf '\n<details><summary>%s的逐表差异</summary>\n\n' "$title"
              sed -e '1{/^## /d;}' -e 's/^### /#### /' "$report/diff/$part.md"
              printf '\n</details>\n'
            done
          } >> "$report/report.md"
          cat "$report/report.md" >> "$GITHUB_STEP_SUMMARY"
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - name: Upload the report
        if: ${{ !cancelled() && steps.scope.outputs.relevant == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dictionary-eval-gate
          path: ${{ runner.temp }}/report/
          if-no-files-found: ignore
          retention-days: 30
      # 方案第 5 节要求的 dry-run 构建结果：与发布同样的两组产物，审阅时可以直接下载对照。
      - name: Upload the candidate dictionaries
        if: ${{ !cancelled() && steps.scope.outputs.relevant == 'true' && steps.candidate.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dictionary-candidate
          path: |
            ${{ runner.temp }}/candidate/
            ${{ runner.temp }}/candidate-languages/
          if-no-files-found: error
          retention-days: 7
      - name: Check the result
        if: ${{ steps.scope.outputs.relevant == 'true' }}
        env:
          STATUS: ${{ steps.gate.outputs.status }}
        run: |
          case "$STATUS" in
            0) echo "every hard gate passed" ;;
            1) echo "::error::a hard gate failed; see the job summary"; exit 1 ;;
            *) echo "::error::the eval gate could not run to the end (exit $STATUS); see the step log"; exit 1 ;;
          esac

  # 评论另起一个只有写评论权限的作业，不运行 PR 的任何代码；fork 来的 PR 拿不到写权限，只看作业摘要和 artifact。
  comment:
    name: Eval gate comment
    needs: eval
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && needs.eval.outputs.relevant == 'true' && (needs.eval.result == 'success' || needs.eval.result == 'failure') }}
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pull-requests: write
    concurrency:
      group: dictionary-eval-gate-comment-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      # 作业在写出报告之前就失败时没有 artifact：照样更新评论，写明这次没有结果，不留着上一次的报告。
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: dictionary-eval-gate
          path: report
      # 按标记找自己的评论，不用 gh pr comment --edit-last：同一个 bot 还发 check-words 的评论，「最后一条」可能是那一条。
      - name: Update the pull request comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          marker='<!-- dictionary-eval-gate -->'
          body="$RUNNER_TEMP/body.md"
          {
            echo "$marker"
            if [[ -s report/report.md ]]; then
              cat report/report.md
            else
              printf '## 词库评测把关\n\n这次运行没有产出报告（构建或下载在写出报告之前就失败了），见 [workflow 运行](%s)。\n' "$RUN_URL"
            fi
          } > "$body"
          # 评论正文上限 65536 个字符（这里按字节数算，偏保守）。超出时先去掉附在后面的产物差异明细，还放不下就只留结论表，明细看作业摘要。
          if (( $(wc -c < "$body") > 60000 )); then
            {
              echo "$marker"
              sed '/^### 产物差异/,$d' report/report.md
              printf '\n产物差异的明细太长，没有放进评论，见 [workflow 运行](%s) 的作业摘要和 artifact。\n' "$RUN_URL"
            } > "$body"
          fi
          if (( $(wc -c < "$body") > 60000 )); then
            {
              echo "$marker"
              sed -n '1,/^| 全拼行数下限/p' report/report.md
              printf '\n明细太长，没有放进评论，见 [workflow 运行](%s) 的作业摘要和 artifact。\n' "$RUN_URL"
            } > "$body"
          fi
          id="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --jq ".[] | select(.user.type == \"Bot\" and (.body | contains(\"$marker\"))) | .id" | tail -n 1)"
          if [[ -n "$id" ]]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@"$body" >/dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@"$body" >/dev/null
          fi
