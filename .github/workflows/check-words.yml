name: Check words
on:
  pull_request:
    paths: [custom/words.txt, custom/translations.txt, custom/english.txt, .github/workflows/check-words.yml]
permissions: {contents: read, pull-requests: write}
concurrency: {group: "check-words-${{ github.event.pull_request.number }}", cancel-in-progress: true}
env:
  # The msime commit whose msime-dict-build checks the files: the same parsers and validation the dictionary build uses, so an entry that passes here builds. Move it when msime changes check-words or a custom file format.
  MSIME_COMMIT: 434d8da644553e098368dcf739ba5113881cdc48
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {repository: metasequoiaime/msime, ref: "${{ env.MSIME_COMMIT }}", path: msime, persist-credentials: false}
      # rustup on the runner installs the toolchain msime's rust-toolchain.toml pins.
      - name: Build msime-dict-build
        working-directory: msime
        run: cargo build --release --locked -p msime-dict-builder --bin msime-dict-build
      # The shipped tables an addition must not repeat are msime-pinyin.db and msime-english.db of this repository's latest dict-v release, resolved at run time: every merge to main that touches sources/ or custom/ publishes a new release, so a pinned URL would lag behind after each one. The two files are checked against that release's own msime-SHA256SUMS.txt.
      - name: Fetch the shipped msime-pinyin.db and msime-english.db
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          tag=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases --limit 100 --json tagName --jq '[.[].tagName | select(test("^dict-v[0-9]+\\.[0-9]+\\.[0-9]+$"))] | sort_by(ltrimstr("dict-v") | split(".") | map(tonumber)) | last // empty')
          if [ -z "$tag" ]; then
            echo "::error::no dict-v release found to compare against" >&2
            exit 1
          fi
          echo "Comparing against $tag"
          echo "Comparing against \`$tag\`." >> "$GITHUB_STEP_SUMMARY"
          cd "$RUNNER_TEMP"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" -p msime-pinyin.db -p msime-english.db -p msime-SHA256SUMS.txt
          grep -E '[ *](msime-pinyin\.db|msime-english\.db)$' msime-SHA256SUMS.txt > shipped.sha256
          test "$(wc -l < shipped.sha256)" -eq 2
          sha256sum -c shipped.sha256
      # Additions only, in each of words.txt, translations.txt and english.txt: an edit, deletion or reordering of an existing line is rejected, and every added line must parse as the build parses it and repeat nothing in this change, in its file or in the shipped dictionary. Words and English lines must also fit their file's existing weight range; a translation may give an existing source a new gloss, since the later line wins.
      - name: Check the custom files
        id: check
        env: {BASE_SHA: "${{ github.event.pull_request.base.sha }}"}
        run: |
          # A file that does not exist on the base commit has nothing to append to, so it is left out rather than treating every line as an addition.
          args=()
          add() {
            if ! git cat-file -e "$BASE_SHA:custom/$1" 2>/dev/null; then
              echo "::notice::custom/$1 does not exist on the base commit; skipping its additions check."
              return
            fi
            git show "$BASE_SHA:custom/$1" > "$RUNNER_TEMP/base-$1"
            args+=("$2" "$RUNNER_TEMP/base-$1" "$3" "custom/$1")
          }
          add words.txt --base --head
          add translations.txt --translations-base --translations-head
          add english.txt --english-base --english-head
          if [ ${#args[@]} -eq 0 ]; then
            echo "status=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set +e
          msime/target/release/msime-dict-build check-words "${args[@]}" \
            --msime-db "$RUNNER_TEMP/msime-pinyin.db" --english-db "$RUNNER_TEMP/msime-english.db" --json "$RUNNER_TEMP/report.json" --markdown "$RUNNER_TEMP/summary.md"
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ -f "$RUNNER_TEMP/summary.md" ]; then cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"; fi
      # One comment per pull request, updated on every push, so a rolling submission PR shows the current verdict. A pull request from a fork gets a read-only token and no comment; the job summary above carries the same text. The summary is in RUNNER_TEMP, which hashFiles() cannot see (it only matches under GITHUB_WORKSPACE), so the shell tests for it.
      - name: Comment the result
        if: ${{ always() && steps.check.outputs.status != '' }}
        continue-on-error: true
        env: {GH_TOKEN: "${{ github.token }}", PR: "${{ github.event.pull_request.number }}"}
        run: |
          [ -f "$RUNNER_TEMP/summary.md" ] || exit 0
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/summary.md" --edit-last --create-if-none
      - name: Fail on rejected entries
        if: ${{ steps.check.outputs.status != '0' }}
        env: {STATUS: "${{ steps.check.outputs.status }}"}
        run: |
          echo "check-words exited $STATUS (1 = an entry was rejected, 2 = the check could not run)" >&2
          exit 1
