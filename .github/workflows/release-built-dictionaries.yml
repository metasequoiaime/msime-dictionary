name: Release built dictionaries

# 生成词库属于本仓库的发布边界：msime-dictionary 保存源数据，也发布由 msime 构建器生成的数据库。
# 源文件保存在本仓库的 Git 提交中；本 workflow 一次构建并发布完整的 dict-v 词库 Release。
on:
  workflow_dispatch:
    inputs:
      version:
        description: "发布版本号（例如 3.0.0；生成 dict-vX.Y.Z 标签）"
        required: true
        type: string
      msime_ref:
        description: "用于构建的 msime 分支、标签或提交"
        required: true
        default: develop
        type: string
      publish:
        description: "发布 GitHub Release；关闭时只上传 workflow artifact"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-built-dictionaries
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout dictionary sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout msime builder
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: metasequoiaime/msime
          ref: ${{ inputs.msime_ref }}
          path: msime
          persist-credentials: false
      - name: Validate version
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          [[ "$REQUESTED" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "version must be X.Y.Z, got '$REQUESTED'" >&2; exit 1; }
      - name: Install Rust
        working-directory: msime
        run: rustup toolchain install
      - name: Build msime-dict-build
        run: cargo build --manifest-path msime/Cargo.toml --release --locked -p msime-dict-builder
      - name: Build all dictionaries
        run: |
          set -euo pipefail
          cache="$RUNNER_TEMP/dictionary-sources"
          out="$RUNNER_TEMP/dictionary-release"
          msime/target/release/msime-dict-build --repository msime --cache "$cache" --out "$out"
          msime/target/release/msime-dict-build languages --repository msime --cache "$cache" --out "$out"
          for name in msime-pinyin.db msime-wubi.db msime-english.db msime-others.db msime-japanese.dat msime-bigram.bin msime-trigram.bin msime-mozc_dictionary_oss_README.txt msime-dictionary-manifest.json msime-SHA256SUMS.txt msime-cantonese.db msime-zhuyin.db msime-rime_cantonese_LICENSE.txt msime-libchewing_data_LICENSE.txt msime-language-dictionaries-SHA256SUMS; do
            [[ -s "$out/$name" ]] || { echo "missing $out/$name" >&2; exit 1; }
          done
          if [[ -e "$out/msime-stroke.db" || -e "$out/msime-rime_stroke_LICENSE.txt" ]]; then
            for name in msime-stroke.db msime-rime_stroke_LICENSE.txt; do [[ -s "$out/$name" ]] || exit 1; done
          fi
          (cd "$out" && sha256sum -c msime-SHA256SUMS.txt && sha256sum -c msime-language-dictionaries-SHA256SUMS)
          jq -e '.licensing.includes_unlicensed_inputs == false and .source.dirty == false' "$out/msime-dictionary-manifest.json" >/dev/null
          artifact="msime-dictionary-${{ inputs.version }}"
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
        id: build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.build.outputs.artifact }}
          path: ${{ runner.temp }}/dictionary-release/
          if-no-files-found: error
    outputs:
      artifact: ${{ steps.build.outputs.artifact }}

  publish:
    needs: build
    if: ${{ inputs.publish }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository for release target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: dist
      - name: Publish dictionary release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          MSIME_REF: ${{ inputs.msime_ref }}
        run: |
          set -euo pipefail
          tag="dict-v${VERSION}"
          (cd dist && sha256sum -c msime-SHA256SUMS.txt && sha256sum -c msime-language-dictionaries-SHA256SUMS)
          jq -r --arg ref "$MSIME_REF" '"Built by msime-dict-build and msime-dict-build languages from metasequoiaime/msime \($ref).\n\nCustom dictionary: \(.custom_dictionary_repository) \(.custom_dictionary_commit).\n\nPinned inputs: resources/dictionary-sources.lock.json at that msime revision. Checksums: msime-SHA256SUMS.txt and msime-language-dictionaries-SHA256SUMS."' dist/msime-dictionary-manifest.json > notes.md
          gh release create "$tag" dist/msime-pinyin.db dist/msime-wubi.db dist/msime-english.db dist/msime-others.db dist/msime-japanese.dat dist/msime-cantonese.db dist/msime-zhuyin.db dist/msime-stroke.db dist/msime-bigram.bin dist/msime-trigram.bin dist/msime-mozc_dictionary_oss_README.txt dist/msime-rime_cantonese_LICENSE.txt dist/msime-libchewing_data_LICENSE.txt dist/msime-rime_stroke_LICENSE.txt dist/msime-dictionary-manifest.json dist/msime-SHA256SUMS.txt dist/msime-language-dictionaries-SHA256SUMS --target main --title "$tag" --notes-file notes.md --latest=false
