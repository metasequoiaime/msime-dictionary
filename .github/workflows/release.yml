name: Release

# 推送到 main 会刷新 release-please 的发版 Pull Request；合并后创建 sources-vX.Y.Z 草稿发布，assets 任务把 cn/、en/、yue/、tw/、stroke/、ja/、ko/ 和 custom/ 下的文件连同 SHA256SUMS.txt 上传并发布。msime 在 resources/dictionary-sources.lock.json 中按 URL、大小和 SHA-256 固定这些附件，已发布版本不可修改，数据修正应发布新版本。
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release pull request
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # The organization token, not GITHUB_TOKEN, so the release pull request it opens runs the repository's checks.
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          target-branch: main
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

  assets:
    name: Upload and publish
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - name: Collect assets
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/assets"
          # Assets are uploaded flat, so two data files may not share a name across directories.
          dupes="$(find cn en yue tw stroke ja ko custom -type f -printf '%f\n' | sort | uniq -d)"
          if [[ -n "$dupes" ]]; then
            echo "::error::duplicate asset names: $dupes"
            exit 1
          fi
          find cn en yue tw stroke ja ko custom -type f -exec cp {} "$RUNNER_TEMP/assets/" \;
          (cd "$RUNNER_TEMP/assets" && sha256sum -- * > SHA256SUMS.txt)
          cat "$RUNNER_TEMP/assets/SHA256SUMS.txt"
      - name: Upload and publish
        run: |
          set -euo pipefail
          gh release upload "$TAG" "$RUNNER_TEMP"/assets/* --repo "$GITHUB_REPOSITORY"
          gh release edit "$TAG" --draft=false --latest --repo "$GITHUB_REPOSITORY"
