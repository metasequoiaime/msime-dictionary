name: Repository quality
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  workflows:
    name: Workflow validation
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.26'
          cache: false
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Validate workflows and embedded shell scripts
        env:
          # Ignore style suggestions, but fail on shell correctness warnings and errors.
          SHELLCHECK_OPTS: --severity=warning
        run: actionlint -color
  upstream:
    name: Upstream record
    runs-on: depot-ubuntu-24.04-8
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check upstream copies against upstream.lock.json
        run: |
          python3 scripts/check_upstream.py
          python3 scripts/update_rime_ice_only.py --check
          python3 -m unittest discover -s scripts -p test_rime_ice_only.py
          python3 -m unittest discover -s scripts -p test_sync_upstream_dictionaries.py
          python3 -m unittest discover -s scripts -p test_hong_kong.py
          python3 scripts/check_hong_kong.py
  builder:
    name: Builder pin
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Merging to main publishes a release, so a malformed pin or one that is not on msime develop must fail here rather than in the release run after merge.
      - name: Check builder.lock.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/check_builder_lock.sh builder.lock.json
  dependencies:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v4
        with:
          fail-on-severity: high
