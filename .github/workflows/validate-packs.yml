name: Validate packs
on:
  pull_request:
    paths: [packs/**, data/translations.txt, scripts/validate_packs.py, .github/workflows/validate-packs.yml]
permissions: {contents: read}
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      # Field formats, pinyin, duplicates and translation coverage of every professional pack, and the format of data/translations.txt.
      - run: python3 scripts/validate_packs.py
