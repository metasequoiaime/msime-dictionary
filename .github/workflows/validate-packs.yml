name: Validate packs
on:
  pull_request:
    paths: [packs/**, custom/translations.txt, custom/words.txt, sources/pinyin/rime-ice.txt, sources/pinyin/rime-ice-supplement.txt, sources/pinyin/places.txt, sources/pinyin/single-chars.txt, sources/unlicensed/custom-pinyin-dictionary-part1.txt, sources/unlicensed/custom-pinyin-dictionary-part2.txt, scripts/validate_packs.py, .github/workflows/validate-packs.yml]
permissions: {contents: read}
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      # Field formats, weights, pinyin, translation coverage and duplicates of every professional pack (readings against sources/pinyin/single-chars.txt and the single characters of rime-ice-supplement.txt; duplicates against the released pinyin inputs sources/pinyin/rime-ice.txt, rime-ice-supplement.txt, places.txt and custom/words.txt, and against sources/unlicensed/custom-pinyin-dictionary-part1/2.txt only as a note), and the format of custom/translations.txt.
      - run: python3 scripts/validate_packs.py
