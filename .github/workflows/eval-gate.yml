name: Dictionary eval gate

# 合入 main 就是发布（release-built-dictionaries.yml），约 24 小时后客户端自动收到，所以排序评测必须在合入之前跑完。这里在每个改动发布输入（sources/、custom/、curation/、builder.lock.json）的 Pull Request 上：用候选提交里 builder.lock.json 固定的 msime 构建器构建候选词库 C，下载最新的 dict-v 发布作为基线 B，再由同一个 msime 提交里的 scripts/dict_eval_gate.py 跑 dict-cleanse 方案 4.3 的五道硬门槛（金标准对不丢、must-outrank、粗俗首屏曝光 C ≤ B、quanpin-words-v2 三种键盘的配对 McNemar、全拼行数下限）。报告写进作业摘要、上传为 artifact，同仓库的 PR 上更新一条评论；任何一道门槛失败，这个检查就失败。
#
# 评测脚本和构建器取自同一个固定提交：门槛的口径（评测集、词表、判定规则）随构建器一起由 builder.lock.json 显式升级，不跟随 msime develop。固定提交里还没有 scripts/dict_eval_gate.py 时作业失败并说明原因，先把 builder.lock.json 升到含它的提交。手动运行可以用 msime_ref 换一个 msime 分支或提交试跑（只用于试跑；PR 上总是用固定提交）。
#
# 不改动发布输入的 PR（文档、packs/、workflow 以外的脚本）不会发布任何东西，作业只判定范围就以成功结束，这样把「Eval gate」设为 main 的 required check 时，这些 PR 不会一直等一个不会出现的检查。
#
# 时间：全部 convert_eval 并行跑在 8 核 runner 上。quanpin-words-v2 默认全量；作业逼近 120 分钟上限时，把 QUANPIN_V2_LIMIT 设成等距子集的大小（B、C 用同一批用例，其余门槛仍然全量）。
on:
  push:
    branches: [cleanse-data/eval-gate-ci]
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      msime_ref:
        description: "留空用 builder.lock.json 固定的 msime 提交；填 msime 的分支、标签或提交只用于试跑"
        required: false
        default: ""
        type: string
      limit:
        description: "quanpin-words-v2 的等距子集大小，0 是全量；留空用 workflow 的默认值"
        required: false
        default: ""
        type: string
      arms:
        description: "评测臂：model（产品默认，挂模型），或 model,engine 再加一臂不挂模型（只跑 quanpin-words-v2）"
        required: false
        default: model
        type: string

permissions: {}

env:
  # quanpin-words-v2 等距子集的默认大小，0 是全量（23,295 条）。
  QUANPIN_V2_LIMIT: "0"
  # 同时跑几个 convert_eval（每个只用一个核）。
  EVAL_JOBS: "8"

jobs:
  eval:
    name: Eval gate
    runs-on: depot-ubuntu-24.04-8
    timeout-minutes: 120
    permissions:
      contents: read
    concurrency:
      group: dictionary-eval-gate-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    outputs:
      relevant: ${{ steps.scope.outputs.relevant }}
    env:
      SCCACHE_IGNORE_SERVER_IO_ERROR: '1'
      CARGO_INCREMENTAL: '0'
    steps:
      # 历史只取提交不取文件内容：判定范围要比较基准提交，构建只需要本次提交的文件。PR 上检出的是合并提交，评测的就是合入后会发布的内容。
      - name: Checkout dictionary sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: dictionary
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - name: Decide whether this change reaches a release
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          MERGE_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            pull_request) base="$PR_BASE" ;;
            merge_group) base="$MERGE_BASE" ;;
            *) base="" ;;
          esac
          relevant=true
          if [[ -n "$base" ]]; then
            changed="$(git -C dictionary diff --no-renames --name-only "$base" HEAD -- sources custom curation builder.lock.json .github/workflows/eval-gate.yml)"
            if [[ -z "$changed" ]]; then
              relevant=false
              echo "这次改动没有碰发布输入（sources/、custom/、curation/、builder.lock.json），合入不会发布，不跑评测。" >> "$GITHUB_STEP_SUMMARY"
            else
              printf 'changed release inputs:\n%s\n' "$changed"
            fi
          fi
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"
      # 固定提交来自候选提交自己的 builder.lock.json：升级构建器的 PR 评测的就是新构建器构建、新门槛判定的结果。这里只核对格式；提交在不在 msime develop 上由 quality.yml 的 Builder pin 检查。
      - name: Resolve the msime builder
        id: builder
        if: ${{ steps.scope.outputs.relevant == 'true' }}
        env:
          OVERRIDE: ${{ inputs.msime_ref || 'cleanse/eval-gate-ci' }}
        run: |
          set -euo pipefail
          pin="$(jq -er '.msime_commit' dictionary/builder.lock.json)"
          [[ "$pin" =~ ^[0-9a-f]{40}$ ]] || { echo "builder.lock.json msime_commit must be a full 40-character commit, got '$pin'" >&2; exit 1; }
          ref="${OVERRIDE:-$pin}"
          pinned=false
          [[ "$ref" == "$pin" ]] && pinned=true
          {
            echo "pin=$pin"
            echo "ref=$ref"
            echo "pinned=$pinned"
          } >> "$GITHUB_OUTPUT"
          echo "msime: $ref (pinned: $pinned)"
      - name: Checkout msime builder and eval tools
        if: ${{ steps.scope.outputs.relevant == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: metasequoiaime/msime
          ref: ${{ steps.builder.outputs.ref }}
          path: msime
          persist-credentials: false
      - name: Check the eval entry point
        id: tools
        if: ${{ steps.scope.outputs.relevant == 'true' }}
        run: |
          set -euo pipefail
          commit="$(git -C msime rev-parse HEAD)"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          if [[ ! -f msime/scripts/dict_eval_gate.py ]]; then
            echo "::error::msime $commit has no scripts/dict_eval_gate.py; bump builder.lock.json to a msime develop commit that includes the eval gate before relying on this check"
            exit 1
          fi
      # 按 msime 锁下载的源数据（ECDICT、zhwiki 语料片段、区划表、SCOWL、HKCanCor）。构建器只复用大小和摘要都对得上的文件，缓存旧了只会多下载。
      - name: Restore the pinned dictionary sources
        id: sources
        if: ${{ steps.scope.outputs.relevant == 'true' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/dictionary-sources
          key: dictionary-eval-sources-${{ hashFiles('msime/resources/dictionary-sources.lock.json') }}
          restore-keys: dictionary-eval-sources-
      # Depot 的 runner 已把 SCCACHE_WEBDAV_ENDPOINT 指向 Depot Cache；sccache 装不上或起不来时照常不带缓存编译。
      - name: Install sccache
        id: sccache
        if: ${{ steps.scope.outputs.relevant == 'true' }}
        continue-on-error: true
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: Enable sccache
        if: ${{ steps.scope.outputs.relevant == 'true' && steps.sccache.outcome == 'success' }}
        run: |
          if sccache --start-server; then
            echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          else
            echo "::warning::sccache did not start; the Rust build runs without the compile cache"
          fi
      - name: Build msime-dict-build and convert_eval
        if: ${{ steps.scope.outputs.relevant == 'true' }}
        working-directory: msime
        run: |
          set -euo pipefail
          rustup toolchain install
          cargo build --release --locked -p msime-dict-builder --bin msime-dict-build
          cargo build --release --locked -p msime-input-runtime --example convert_eval
      # 只跑主构建：评测读的是桌面词库锁里的那组主产物，粤拼、注音、笔画（languages）由发布试跑检查。
      - name: Build the candidate dictionaries
        if: ${{ steps.scope.outputs.relevant == 'true' }}
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/candidate"
          msime/target/release/msime-dict-build --repository msime --dictionary "$GITHUB_WORKSPACE/dictionary" --cache "$RUNNER_TEMP/dictionary-sources" --out "$out"
          (cd "$out" && sha256sum -c msime-SHA256SUMS.txt)
          jq -e '.licensing.includes_unlicensed_inputs == false and .source.dirty == false' "$out/msime-dictionary-manifest.json" >/dev/null || {
            echo "candidate manifest check failed: expected unlicensed inputs excluded and a clean builder" >&2
            jq '{licensing, source}' "$out/msime-dictionary-manifest.json" >&2
            exit 1
          }
      - name: Save the pinned dictionary sources
        if: ${{ !cancelled() && steps.scope.outputs.relevant == 'true' && steps.sources.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/dictionary-sources
          key: ${{ steps.sources.outputs.cache-primary-key }}
      # 基线是用户此刻手里的词库：本仓最新的 dict-v 发布（每次合入发布一版，所以运行时现查，不固定版本），按它自带的 msime-SHA256SUMS.txt 下载并校验其中列出的全部文件。
      - name: Download the baseline release
        id: baseline
        if: ${{ steps.scope.outputs.relevant == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases --limit 100 --json tagName --jq '[.[].tagName | select(test("^dict-v[0-9]+\\.[0-9]+\\.[0-9]+$"))] | sort_by(ltrimstr("dict-v") | split(".") | map(tonumber)) | last // empty')"
          [[ -n "$tag" ]] || { echo "no dict-v release to compare against" >&2; exit 1; }
          dir="$RUNNER_TEMP/baseline"
          mkdir -p "$dir"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir "$dir" -p msime-SHA256SUMS.txt
          patterns=()
          while read -r _ name; do
            patterns+=(-p "${name#\*}")
          done < "$dir/msime-SHA256SUMS.txt"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir "$dir" "${patterns[@]}"
          (cd "$dir" && sha256sum -c msime-SHA256SUMS.txt)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "baseline: $tag"
      # 挂模型的一臂是产品默认：模型在 msime 桌面词库锁里，按锁的 URL 下载、按锁的 SHA-256 校验。
      - name: Download the sentence model
        if: ${{ steps.scope.outputs.relevant == 'true' }}
        run: |
          set -euo pipefail
          entry="$(jq -ec '.artifacts[] | select(.name == "sentence-model.safetensors")' msime/resources/desktop-dictionary.lock.json)"
          url="$(jq -r .url <<< "$entry")"
          sha="$(jq -r .sha256 <<< "$entry")"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/sentence-model.safetensors" "$url"
          echo "$sha  $RUNNER_TEMP/sentence-model.safetensors" | sha256sum -c
      - name: Run the hard gates
        id: gate
        if: ${{ steps.scope.outputs.relevant == 'true' }}
        env:
          EVENT: ${{ github.event_name }}
          SOURCE_SHA: ${{ github.sha }}
          MSIME_REF: ${{ steps.builder.outputs.ref }}
          MSIME_COMMIT: ${{ steps.tools.outputs.commit }}
          PINNED: ${{ steps.builder.outputs.pinned }}
          BASELINE_TAG: ${{ steps.baseline.outputs.tag }}
          LIMIT_INPUT: ${{ inputs.limit }}
          ARMS_INPUT: ${{ inputs.arms || 'model,engine' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/report"
          mkdir -p "$report"
          limit="${LIMIT_INPUT:-$QUANPIN_V2_LIMIT}"
          [[ "$limit" =~ ^[0-9]+$ ]] || { echo "limit must be a non-negative integer, got '$limit'" >&2; exit 1; }
          arms="${ARMS_INPUT:-model}"
          server="${GITHUB_SERVER_URL:-https://github.com}"
          # printf 的格式串用单引号包住，Markdown 代码片段里的反引号保持字面含义。
          # shellcheck disable=SC2016
          {
            printf -- '- 候选：本仓 [`%s`](%s/%s/commit/%s)（%s）\n' "${SOURCE_SHA:0:10}" "$server" "$GITHUB_REPOSITORY" "$SOURCE_SHA" "$EVENT"
            if [[ "$PINNED" == true ]]; then
              printf -- '- 构建器与评测工具：msime [`%s`](%s/metasequoiaime/msime/commit/%s)，`builder.lock.json` 固定的提交\n' "${MSIME_COMMIT:0:10}" "$server" "$MSIME_COMMIT"
            else
              printf -- '- 构建器与评测工具：试跑指定的 msime `%s`，即 [`%s`](%s/metasequoiaime/msime/commit/%s)，不是 `builder.lock.json` 固定的提交\n' "$MSIME_REF" "${MSIME_COMMIT:0:10}" "$server" "$MSIME_COMMIT"
            fi
            printf -- '- 基线：[`%s`](%s/%s/releases/tag/%s)，用户现在自动更新到的版本\n' "$BASELINE_TAG" "$server" "$GITHUB_REPOSITORY" "$BASELINE_TAG"
            printf -- '- [workflow 运行](%s)：完整的 JSON 报告和两边的曝光报告在 artifact `dictionary-eval-gate` 里\n' "$RUN_URL"
          } > "$report/preamble.md"
          status=0
          (cd msime && python3 scripts/dict_eval_gate.py run \
            --baseline "$RUNNER_TEMP/baseline" --candidate "$RUNNER_TEMP/candidate" \
            --model "$RUNNER_TEMP/sentence-model.safetensors" --binary target/release/examples/convert_eval \
            --work "$RUNNER_TEMP/eval" --jobs "$EVAL_JOBS" --limit "$limit" --arms "$arms" \
            --preamble "$report/preamble.md" --markdown "$report/report.md" --json "$report/report.json") > "$report/stdout.txt" || status=$?
          cp "$RUNNER_TEMP"/eval/exposure-*.json "$report/" 2>/dev/null || true
          if [[ ! -s "$report/report.md" ]]; then
            printf '## 词库评测把关\n\n%s\n**评测没能跑完**（exit %s），没有结论，见 workflow 日志。\n' "$(cat "$report/preamble.md")" "$status" > "$report/report.md"
          fi
          cat "$report/report.md" >> "$GITHUB_STEP_SUMMARY"
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - name: Upload the report
        if: ${{ !cancelled() && steps.scope.outputs.relevant == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dictionary-eval-gate
          path: ${{ runner.temp }}/report/
          if-no-files-found: ignore
          retention-days: 30
      - name: Check the result
        if: ${{ steps.scope.outputs.relevant == 'true' }}
        env:
          STATUS: ${{ steps.gate.outputs.status }}
        run: |
          case "$STATUS" in
            0) echo "every hard gate passed" ;;
            1) echo "::error::a hard gate failed; see the job summary"; exit 1 ;;
            *) echo "::error::the eval gate could not run to the end (exit $STATUS); see the step log"; exit 1 ;;
          esac

  # 评论另起一个只有写评论权限的作业，不运行 PR 的任何代码；fork 来的 PR 拿不到写权限，只看作业摘要和 artifact。
  comment:
    name: Eval gate comment
    needs: eval
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && needs.eval.outputs.relevant == 'true' && (needs.eval.result == 'success' || needs.eval.result == 'failure') }}
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pull-requests: write
    concurrency:
      group: dictionary-eval-gate-comment-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      # 作业在写出报告之前就失败时没有 artifact：照样更新评论，写明这次没有结果，不留着上一次的报告。
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: dictionary-eval-gate
          path: report
      # 按标记找自己的评论，不用 gh pr comment --edit-last：同一个 bot 还发 check-words 的评论，「最后一条」可能是那一条。
      - name: Update the pull request comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          marker='<!-- dictionary-eval-gate -->'
          body="$RUNNER_TEMP/body.md"
          {
            echo "$marker"
            if [[ -s report/report.md ]]; then
              cat report/report.md
            else
              printf '## 词库评测把关\n\n这次运行没有产出报告（构建或下载在写出报告之前就失败了），见 [workflow 运行](%s)。\n' "$RUN_URL"
            fi
          } > "$body"
          # 评论正文上限 65536 个字符；超出时只留结论表，明细看作业摘要。
          if (( $(wc -c < "$body") > 60000 )); then
            {
              echo "$marker"
              sed -n '1,/^| 全拼行数下限/p' report/report.md
              printf '\n明细太长，没有放进评论，见 [workflow 运行](%s) 的作业摘要和 artifact。\n' "$RUN_URL"
            } > "$body"
          fi
          id="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --jq ".[] | select(.user.type == \"Bot\" and (.body | contains(\"$marker\"))) | .id" | tail -n 1)"
          if [[ -n "$id" ]]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@"$body" >/dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@"$body" >/dev/null
          fi
