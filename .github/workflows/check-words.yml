name: Check words
on:
  pull_request:
    paths: [custom/words.txt, .github/workflows/check-words.yml]
permissions: {contents: read, pull-requests: write}
concurrency: {group: "check-words-${{ github.event.pull_request.number }}", cancel-in-progress: true}
env:
  # The msime commit whose msime-dict-build checks the file: the same parser and validation the dictionary build uses, so an entry that passes here builds. Move it when msime changes check-words or the custom word format.
  MSIME_COMMIT: 0eb33f087c36722fec9927d7b76a4b1ae9a8b33b
  # The shipped quanpin tables an addition must not repeat, pinned as msime's resources/desktop-dictionary.lock.json pins them.
  MSIME_DB_URL: https://github.com/metasequoiaime/msime-engine/releases/download/dict-v2.0.1/msime.db
  MSIME_DB_SHA256: 960d0491458bf3c5b4f199c5f5705353e1ecb6506eafbae5e8e1474d70232894
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {repository: metasequoiaime/msime, ref: "${{ env.MSIME_COMMIT }}", path: msime, persist-credentials: false}
      # rustup on the runner installs the toolchain msime's rust-toolchain.toml pins.
      - name: Build msime-dict-build
        working-directory: msime
        run: cargo build --release --locked -p msime-dict-builder --bin msime-dict-build
      - name: Fetch the shipped msime.db
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/msime.db" "$MSIME_DB_URL"
          echo "$MSIME_DB_SHA256  $RUNNER_TEMP/msime.db" | sha256sum -c -
      # Additions only: an edit, deletion or reordering of an existing line is rejected, and every added line must parse, fit the existing weight range, and repeat nothing in this change, in words.txt or in the shipped tables.
      - name: Check custom/words.txt
        id: check
        env: {BASE_SHA: "${{ github.event.pull_request.base.sha }}"}
        run: |
          # Only the pull request that first adds custom/words.txt has a base without it; there is nothing to append to, so that run is skipped rather than treating every line as an addition.
          if ! git cat-file -e "$BASE_SHA:custom/words.txt" 2>/dev/null; then
            echo "::notice::custom/words.txt does not exist on the base commit; skipping the additions check."
            echo "status=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git show "$BASE_SHA:custom/words.txt" > "$RUNNER_TEMP/base-words.txt"
          set +e
          msime/target/release/msime-dict-build check-words --base "$RUNNER_TEMP/base-words.txt" --head custom/words.txt \
            --msime-db "$RUNNER_TEMP/msime.db" --json "$RUNNER_TEMP/report.json" --markdown "$RUNNER_TEMP/summary.md"
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ -f "$RUNNER_TEMP/summary.md" ]; then cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"; fi
      # One comment per pull request, updated on every push, so a rolling submission PR shows the current verdict. A pull request from a fork gets a read-only token and no comment; the job summary above carries the same text.
      - name: Comment the result
        if: ${{ always() && steps.check.outputs.status != '' && hashFiles(format('{0}/summary.md', runner.temp)) != '' }}
        continue-on-error: true
        env: {GH_TOKEN: "${{ github.token }}", PR: "${{ github.event.pull_request.number }}"}
        run: gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/summary.md" --edit-last --create-if-none
      - name: Fail on rejected entries
        if: ${{ steps.check.outputs.status != '0' }}
        env: {STATUS: "${{ steps.check.outputs.status }}"}
        run: |
          echo "check-words exited $STATUS (1 = an entry was rejected, 2 = the check could not run)" >&2
          exit 1
