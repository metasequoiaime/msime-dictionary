name: Validate packs
on:
  pull_request:
    paths: [packs/**, custom/translations.txt, custom/words.txt, pinyin/BaseDictIceV1.txt, pinyin/RimeIceSupplementV1.txt, pinyin/SingleCharsAllV1.txt, unlicensed/BaseDictAllV1Part1.txt, unlicensed/BaseDictAllV1Part2.txt, scripts/validate_packs.py, .github/workflows/validate-packs.yml]
permissions: {contents: read}
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      # Field formats, weights, pinyin, translation coverage and duplicates of every professional pack (against the released pinyin inputs pinyin/BaseDictIceV1.txt, pinyin/RimeIceSupplementV1.txt and custom/words.txt; unlicensed/BaseDictAllV1Part1/2 only as a note), and the format of custom/translations.txt.
      - run: python3 scripts/validate_packs.py
